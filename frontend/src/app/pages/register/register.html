<div class="register-container">
  <div class="register-card">
    <h2>Crear Cuenta</h2>
    <p class="subtitle">Únete y empieza a dejar tus reseñas</p>

    <input type="text" placeholder="Nombre de usuario" [(ngModel)]="username">
    <input type="email" placeholder="Correo electrónico" [(ngModel)]="email">
    <input type="password" placeholder="Contraseña" [(ngModel)]="password">

    <button (click)="register()">Registrarme</button>

    <p class="login-text">
      ¿Ya tienes una cuenta?
      <a routerLink="/login">Iniciar Sesión</a>
    </p>
  </div>
</div>
